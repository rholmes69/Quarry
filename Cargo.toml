[package]
name = "quarry"
version = "0.1.0"
description = "A DB Browser for SQLite-style workbench written in Rust"
license = "MIT OR Apache-2.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
csv = "1.4"
eframe = { version = "0.37", features = ["glow"] }
egui_extras = "0.37"
egui = "0.37"
rfd = "0.17"
rusqlite = { version = "0.40", features = ["bundled", "column_decltype"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
opt-level = 3
