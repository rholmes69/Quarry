[package]
name = "quarry"
version = "0.1.0"
description = "A DB Browser for SQLite-style workbench written in Rust"
license = "MIT OR Apache-2.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
csv = "1.4"
eframe = { version = "0.37", features = ["glow"] }
egui_extras = "0.37"
egui = "0.37"
rfd = "0.17"
rusqlite = { version = "0.40", features = ["bundled", "column_decltype"] }

# Enterprise server drivers for Data Pipe (disable with --no-default-features)
postgres = { version = "0.19", optional = true }
postgres-native-tls = { version = "0.5", optional = true }
native-tls = { version = "0.2", optional = true }
mysql = { version = "28", default-features = false, features = ["default-rust", "native-tls"], optional = true }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "native-tls", "chrono"], optional = true }
tokio = { version = "1", features = ["rt", "net", "time"], optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }

[features]
default = ["pg", "mysql-driver", "mssql"]
pg = ["dep:postgres", "dep:postgres-native-tls", "dep:native-tls"]
mysql-driver = ["dep:mysql"]
mssql = ["dep:tiberius", "dep:tokio", "dep:tokio-util"]

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
opt-level = 3
